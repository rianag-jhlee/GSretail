  - generic [ref=f80e36]:
    - heading "이사회 의장 인사말" [level=2] [ref=f80e38]
    - article [ref=f80e41]:
      - generic [ref=f80e42]:
        - figure [ref=f80e43]
        - generic [ref=f80e44]:
          - paragraph [ref=f80e45]: ㈜GS리테일 이사회 의장
          - strong [ref=f80e46]: 사외이사 이성락
      - generic [ref=f80e47]:
        - heading "존경하는 GS리테일 주주 여러분 안녕하십니까? GS리테일 이사회 의장 이성락입니다." [level=3] [ref=f80e48]:
          - text: 존경하는 GS리테일 주주 여러분 안녕하십니까?
          - text: GS리테일 이사회 의장 이성락입니다.
        - paragraph [ref=f80e49]: 우리 회사는 투명한 지배구조 확립을 위해, 2020년 11월부터 대표이사와 이사회 의장을 분리하여 이사회를 운영하고 있습니다.
        - paragraph [ref=f80e50]:
          - text: 저는 이사회 의장으로서 GS리테일 주주의 권리 보호 및 공정한 대우를 통해 주주의 기본권을 최대한 보장하고,
          - text: 주주와의 신뢰 구축을 바탕으로 기업 가치를 극대화하고자 노력하고 있습니다.
        - paragraph [ref=f80e51]:
          - text: 또한, 의사결정의 효율성을 위해 전문성을 갖춘 유능한 인사로 이사회를 구성하여, 주주가치 제고를 위해 최선을 다하고 있으며,
          - text: 특히 감사위원회는 전원 사외이사 및 1인 이상의 재무 · 회계 전문가로 구성하고, 경영진과 지배주주로부터 독립적인 경영활동이 보장될 수
          - text: 있도록 하고 있습니다.
        - paragraph [ref=f80e52]:
          - text: 더불어 ESG관점의 지속가능경영 강화를 위해 ESG위원회, 보상위원회를 설치하는 등 이사회 내 5개의 위원회를 운영하며,
          - text: 의사결정의 독립성과 전문성을 제고하기 위해 노력하고 있습니다.
        - paragraph [ref=f80e53]:
          - text: 이 밖에도 다양한 이해관계자의 권리 보호, 공정한 거래 문화 확립, 지역 사회와의 상생 등 기업의 사회적 책임을 다하는 한편,
          - text: GS리테일이 지속 성장하는 기업이 될 수 있도록 최선의 노력을 다하겠습니다.
        - paragraph [ref=f80e54]:
          - text: 앞으로도 GS리테일을 향한 많은 관심과 사랑 부탁드립니다.
          - text: 감사합니다.
